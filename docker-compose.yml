# Postgres do projeto (dev + teste). Se já houver um Postgres local ocupando a 5432,
# não suba este compose: basta criar os bancos eloscrm_dev e eloscrm_test nele.
services:
  postgres:
    image: postgres:17-alpine
    container_name: eloscrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eloscrm_dev
    ports:
      - "5432:5432"
    volumes:
      - eloscrm-postgres-data:/var/lib/postgresql/data
      # cria o banco de teste junto com o de dev na primeira subida
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fila das conversas de WhatsApp (BullMQ). Sem ele a API sobe e processa o webhook inline —
  # bom para teste e CI, ruim em produção, onde download de mídia travaria a resposta.
  redis:
    image: redis:7-alpine
    container_name: eloscrm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eloscrm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eloscrm-postgres-data:
  eloscrm-redis-data:
