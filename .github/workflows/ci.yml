name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eloscrm-api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eloscrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eloscrm_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-secret-nao-usar-fora-do-ci
      BETTER_AUTH_URL: http://localhost:3333
      WEB_ORIGIN: http://localhost:3000
      PORT: 3333

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eloscrm-api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # src/generated não é versionado; sem generate, typecheck e testes não compilam
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eloscrm-web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eloscrm-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
