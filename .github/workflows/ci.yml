name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eloscrm-api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eloscrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eloscrm_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-secret-nao-usar-fora-do-ci
      BETTER_AUTH_URL: http://localhost:3333
      WEB_ORIGIN: http://localhost:3000
      PORT: 3333
      R2_ENDPOINT: http://localhost:8333
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test12345
      R2_PRIVATE_BUCKET_NAME: eloscrm-test

    steps:
      - uses: actions/checkout@v4

      - name: Sobe S3 local (MinIO)
        run: |
          docker run -d --name minio -p 8333:9000 \
            -e MINIO_ROOT_USER=test -e MINIO_ROOT_PASSWORD=test12345 \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:8333/minio/health/live && break
            sleep 1
          done

      # `defaults.run.working-directory` vale só para steps `run`, não para actions: sem apontar o
      # arquivo, a action procura o "packageManager" no package.json da raiz — que este repo não tem
      # (são dois projetos independentes) — e falha com "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: eloscrm-api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eloscrm-api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # src/generated não é versionado; sem generate, typecheck e testes não compilam
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # o build usa um tsconfig próprio e não é exercitado por nenhum dos passos acima:
      # sem este step, quebrar a compilação de produção só aparece no deploy
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eloscrm-web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: eloscrm-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eloscrm-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
