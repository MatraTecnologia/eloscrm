name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eloscrm-api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eloscrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/eloscrm_test?sslmode=disable
      BETTER_AUTH_SECRET: ci-secret-nao-usar-fora-do-ci
      BETTER_AUTH_URL: http://localhost:3333
      WEB_ORIGIN: http://localhost:3000
      PORT: 3333
      R2_ENDPOINT: http://localhost:8333
      R2_ACCESS_KEY_ID: test
      R2_SECRET_ACCESS_KEY: test12345
      R2_PRIVATE_BUCKET_NAME: eloscrm-test
      # uazapi: a suíte mocka o client HTTP; estes valores são fictícios e nada sai do runner.
      UAZAPI_BASE_URL: http://uazapi.invalid
      UAZAPI_ADMIN_TOKEN: ci-admin-token
      UAZAPI_TOKEN_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      AUDIT_RETENTION_DAYS: 365
      PUBLIC_API_URL: http://localhost:3333

    steps:
      - uses: actions/checkout@v4

      # SeaweedFS no lugar do MinIO, que deixou de publicar imagem pública (o pull falhava com
      # "pull access denied"). Sem identidade configurada o SeaweedFS aceita acesso anônimo, e
      # storage.test.ts exige 403 para leitura sem assinatura: por isso a credencial vai em -s3.config.
      - name: Sobe S3 local (SeaweedFS)
        run: |
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"test","secretKey":"test12345"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' > "$RUNNER_TEMP/seaweedfs/s3.json"
          docker run -d --name seaweedfs -p 8333:8333 -v "$RUNNER_TEMP/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.50 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" = "403" ] && break
            sleep 1
          done

      # `defaults.run.working-directory` vale só para steps `run`, não para actions: sem apontar o
      # arquivo, a action procura o "packageManager" no package.json da raiz — que este repo não tem
      # (são dois projetos independentes) — e falha com "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: eloscrm-api/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: eloscrm-api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # src/generated não é versionado; sem generate, typecheck e testes não compilam
      - run: pnpm db:generate
      - run: pnpm db:push
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # o build usa um tsconfig próprio e não é exercitado por nenhum dos passos acima:
      # sem este step, quebrar a compilação de produção só aparece no deploy
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eloscrm-web

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: eloscrm-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: eloscrm-web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
