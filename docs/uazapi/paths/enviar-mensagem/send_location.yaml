post:
  description: |
    Envia uma localização geográfica para um contato ou grupo.

    ## Recursos Específicos

    - **Coordenadas precisas** (latitude e longitude obrigatórias)
    - **Nome do local** para identificação
    - **Endereço completo** para exibição detalhada
    - **Mapa interativo** no WhatsApp para navegação
    - **Pin personalizado** com nome do local

    ## Campos Comuns

    Este endpoint suporta todos os **campos opcionais comuns** documentados na tag **"Enviar Mensagem"**, incluindo:
    `delay`, `readchat`, `readmessages`, `replyid`, `mentions`, `forward`, `track_source`, `track_id`, placeholders e envio para grupos.

    ## Exemplo Básico
    ```json
    {
      "number": "5511999999999",
      "name": "Maracanã",
      "address": "Av. Pres. Castelo Branco - Maracanã, Rio de Janeiro - RJ",
      "latitude": -22.912982815767986,
      "longitude": -43.23028153499254
    }
    ```
  operationId: sendLocation
  requestBody:
    content:
      application/json:
        schema:
          properties:
            address:
              description: Endereço do local
              example: Av. Paulista, 1578 - Bela Vista, São Paulo - SP
              type: string
            async:
              description: Se true, envia a mensagem de forma assíncrona via fila interna
              example: false
              type: boolean
            delay:
              description: Atraso em milissegundos antes do envio, durante o atraso apacerá 'Digitando...'
              example: 1000
              type: integer
            forward:
              description: Marca a mensagem como encaminhada no WhatsApp
              example: true
              type: boolean
            latitude:
              description: Latitude (-90 a 90)
              example: -23.5616
              type: number
            longitude:
              description: Longitude (-180 a 180)
              example: -46.6562
              type: number
            mentions:
              description: Números para mencionar (separados por vírgula)
              example: 5511999999999,5511888888888
              type: string
            name:
              description: Nome do local
              example: MASP
              type: string
            number:
              description: ID do chat para o qual a mensagem será enviada. Pode ser um número de telefone em formato internacional,
                um ID de grupo (`@g.us`), um ID de usuário (com `@s.whatsapp.net` ou `@lid`).
              example: '5511999999999'
              type: string
            readchat:
              description: Marca conversa como lida após envio
              example: true
              type: boolean
            readmessages:
              description: Marca últimas mensagens recebidas como lidas
              example: true
              type: boolean
            replyid:
              description: ID da mensagem para responder
              example: 3EB0538DA65A59F6D8A251
              type: string
            track_id:
              description: ID para rastreamento da mensagem (aceita valores duplicados)
              example: msg_123456789
              type: string
            track_source:
              description: Origem do rastreamento da mensagem
              example: chatwoot
              type: string
          required:
            - number
            - latitude
            - longitude
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../schemas/message.yaml#/Message
              - properties:
                  response:
                    properties:
                      message:
                        example: Location sent successfully
                        type: string
                      status:
                        example: success
                        type: string
                    type: object
                type: object
      description: Localização enviada com sucesso
    '400':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Invalid coordinates or missing number
                type: string
            type: object
      description: Requisição inválida
    '401':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Invalid token
                type: string
            type: object
      description: Não autorizado
    '429':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Rate limit exceeded
                type: string
            type: object
      description: Limite de requisições excedido
    '500':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Failed to send location
                type: string
            type: object
      description: Erro interno do servidor
  summary: Enviar localização geográfica
  tags:
    - Enviar Mensagem
