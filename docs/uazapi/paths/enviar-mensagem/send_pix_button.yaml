post:
  description: |
    Envia um botão nativo do WhatsApp que abre para pagamento PIX com a chave informada.
    O usuário visualiza o detalhe do recebedor, nome e chave.

    ## Regras principais
    - `pixType` aceita: `CPF`, `CNPJ`, `PHONE`, `EMAIL`, `EVP` (case insensitive)
    - `pixName` padrão: `"Pix"` quando não informado - nome de quem recebe o pagamento


    ## Campos comuns
    Este endpoint herda os campos opcionais padronizados da tag **"Enviar Mensagem"**:
    `delay`, `readchat`, `readmessages`, `replyid`, `mentions`, `track_source`, `track_id` e `async`.

    ## Exemplo de payload
    ```json
    {
      "number": "5511999999999",
      "pixType": "EVP",
      "pixKey": "123e4567-e89b-12d3-a456-426614174000",
      "pixName": "Loja Exemplo"
    }
    ```
  operationId: sendPixButton
  requestBody:
    content:
      application/json:
        schema:
          example:
            number: '5511999999999'
            pixKey: 123e4567-e89b-12d3-a456-426614174000
            pixName: Loja Exemplo
            pixType: EVP
          properties:
            async:
              description: Enfileira o envio para processamento assíncrono
              type: boolean
            delay:
              description: Atraso em milissegundos antes do envio (exibe "digitando..." no WhatsApp)
              type: integer
            mentions:
              description: Lista de números mencionados separados por vírgula
              type: string
            number:
              description: ID do chat para o qual a mensagem será enviada. Pode ser um número de telefone em formato internacional,
                um ID de grupo (`@g.us`), um ID de usuário (com `@s.whatsapp.net` ou `@lid`).
              example: '5511999999999'
              type: string
            pixKey:
              description: Valor da chave PIX (CPF/CNPJ/telefone/email/EVP)
              example: 123e4567-e89b-12d3-a456-426614174000
              type: string
            pixName:
              description: Nome exibido como recebedor do PIX (padrão "Pix" se vazio)
              example: Loja Exemplo
              type: string
            pixType:
              description: 'Tipo da chave PIX. Valores aceitos: CPF, CNPJ, PHONE, EMAIL ou EVP'
              example: EVP
              type: string
            readchat:
              description: Marca o chat como lido após enviar a mensagem
              type: boolean
            readmessages:
              description: Marca mensagens recentes como lidas após o envio
              type: boolean
            replyid:
              description: ID da mensagem que será respondida
              type: string
            track_id:
              description: Identificador de rastreamento (aceita valores duplicados)
              type: string
            track_source:
              description: 'Origem de rastreamento (ex.: chatwoot, crm-interno)'
              type: string
          required:
            - number
            - pixType
            - pixKey
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../../schemas/message.yaml#/Message
              - properties:
                  response:
                    properties:
                      message:
                        example: PIX button sent successfully
                        type: string
                      status:
                        example: success
                        type: string
                    type: object
                type: object
      description: Botão PIX enviado com sucesso
    '400':
      content:
        application/json:
          schema:
            properties:
              error:
                example: 'Invalid keyType. Allowed: CPF, CNPJ, PHONE, EMAIL, EVP'
                type: string
            type: object
      description: Requisição inválida
    '401':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Invalid token
                type: string
            type: object
      description: Não autorizado
    '500':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Failed to send PIX button
                type: string
            type: object
      description: Erro interno do servidor
  summary: Enviar botão PIX
  tags:
    - Enviar Mensagem
