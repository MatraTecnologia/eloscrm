post:
  description: |
    Transfere a propriedade do canal para outro telefone.

    Observações:
    - `phone` é obrigatório
    - `quitAdmin=true` remove o dono anterior da posição de admin após a transferência
  operationId: transferNewsletterOwnership
  requestBody:
    content:
      application/json:
        schema:
          properties:
            id:
              example: '120363123456789012'
              type: string
            jid:
              example: 120363123456789012@newsletter
              type: string
            phone:
              example: '5511999999999'
              type: string
            quitAdmin:
              example: false
              type: boolean
          required:
            - phone
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                example: true
                type: boolean
            type: object
      description: Transferência solicitada com sucesso
    '400':
      content:
        application/json:
          schema:
            properties:
              error:
                example: phone is required
                type: string
            type: object
      description: Payload inválido
    '401':
      content:
        application/json:
          schema:
            properties:
              error:
                example: client not found
                type: string
            type: object
      description: Instância não autenticada ou cliente não encontrado
    '500':
      content:
        application/json:
          schema:
            properties:
              error:
                example: connection closed
                type: string
            type: object
      description: Erro interno ao transferir ownership do canal
  summary: Transferir dono do canal
  tags:
    - Newsletters e Canais
