post:
  description: |
    Assina temporariamente os live updates internos do WhatsApp para um canal.

    Observação:
    - esta rota retorna apenas a duração da assinatura temporária
    - isso não cria um novo evento de webhook
  operationId: subscribeNewsletterLiveUpdates
  requestBody:
    content:
      application/json:
        schema:
          properties:
            id:
              example: '120363123456789012'
              type: string
            jid:
              example: 120363123456789012@newsletter
              type: string
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                description: Duração retornada pelo WhatsApp.
                example: 5m0s
                type: string
            type: object
      description: Assinatura criada com sucesso
    '400':
      content:
        application/json:
          schema:
            properties:
              error:
                example: invalid newsletter id
                type: string
            type: object
      description: ID/JID inválido
    '401':
      content:
        application/json:
          schema:
            properties:
              error:
                example: client not found
                type: string
            type: object
      description: Instância não autenticada ou cliente não encontrado
    '500':
      content:
        application/json:
          schema:
            properties:
              error:
                example: connection closed
                type: string
            type: object
      description: Erro interno ao assinar updates
  summary: Assinar live updates temporários de um canal
  tags:
    - Newsletters e Canais
