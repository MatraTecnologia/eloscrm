post:
  description: Atualiza o nome do canal/newsletter.
  operationId: updateNewsletterName
  requestBody:
    content:
      application/json:
        schema:
          properties:
            id:
              example: '120363123456789012'
              type: string
            jid:
              example: 120363123456789012@newsletter
              type: string
            name:
              example: Canal de Promoções VIP
              type: string
          required:
            - name
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              response:
                example: true
                type: boolean
            type: object
      description: Nome atualizado com sucesso
    '400':
      content:
        application/json:
          schema:
            properties:
              error:
                example: name is required
                type: string
            type: object
      description: Payload inválido
    '401':
      content:
        application/json:
          schema:
            properties:
              error:
                example: client not found
                type: string
            type: object
      description: Instância não autenticada ou cliente não encontrado
    '500':
      content:
        application/json:
          schema:
            properties:
              error:
                example: connection closed
                type: string
            type: object
      description: Erro interno ao atualizar o nome do canal
  summary: Atualizar nome do canal
  tags:
    - Newsletters e Canais
