post:
  description: "Gera um novo código de convite para o grupo, invalidando o código de convite anterior. \nSomente administradores\
    \ do grupo podem realizar esta ação.\n\nPrincipais características:\n- Invalida o link de convite antigo\n- Cria um novo\
    \ link único\n- Retorna as informações atualizadas do grupo\n"
  operationId: resetGroupInviteCode
  requestBody:
    content:
      application/json:
        schema:
          properties:
            groupjid:
              description: Identificador único do grupo (JID)
              example: 120363308883996631@g.us
              type: string
          required:
            - groupjid
          type: object
    required: true
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              InviteLink:
                description: Novo link de convite gerado
                example: https://chat.whatsapp.com/AbCdEfGhIjKlMnOpQrStUv
                type: string
              group:
                $ref: ../../schemas/group.yaml#/Group
              needs_refresh:
                description: Indica se o grupo precisa ser atualizado no cache local
                example: false
                type: boolean
            type: object
      description: Código de convite resetado com sucesso
    '400':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Could not parse Group JID
                type: string
            type: object
      description: Erro de validação
    '403':
      content:
        application/json:
          schema:
            properties:
              error:
                example: User is not an admin of this group
                type: string
            type: object
      description: Usuário sem permissão
    '500':
      content:
        application/json:
          schema:
            properties:
              error:
                example: Failed to reset group invite link
                type: string
            type: object
      description: Erro interno do servidor
  summary: Resetar código de convite do grupo
  tags:
    - Grupos e Comunidades
